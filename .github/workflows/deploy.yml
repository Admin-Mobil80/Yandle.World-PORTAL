name: Deploy

# dev deploys on every push to main. prod is manual only — a consumer-facing
# domain sharing an AWS account with the live dialer platform should never go
# out because someone merged a README fix.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: deploy-portal-${{ github.event.inputs.stage || 'dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  BUCKET: webapps.yandle.world
  APP: portal

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.stage || 'dev' }}
    permissions:
      id-token: write   # OIDC — no long-lived AWS keys in GitHub secrets
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_STAGE: ${{ github.event.inputs.stage || 'dev' }}
          VITE_COGNITO_REGION: us-east-1
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          VITE_GRAPHQL_ENDPOINT: ${{ vars.GRAPHQL_ENDPOINT }}
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync hashed assets
        # Content-hashed filenames, so they can be cached hard and forever.
        # Uploaded BEFORE index.html so no request can ever land on a new
        # index pointing at assets that are not there yet.
        run: |
          aws s3 sync dist/ "s3://$BUCKET/$APP/${{ github.event.inputs.stage || 'dev' }}/" \
            --exclude "index.html" --exclude "sw.js" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Sync entry points
        # index.html and the service worker must never be cached, or a deploy
        # is invisible until the browser happens to revalidate.
        run: |
          aws s3 sync dist/ "s3://$BUCKET/$APP/${{ github.event.inputs.stage || 'dev' }}/" \
            --exclude "*" --include "index.html" --include "sw.js" \
            --cache-control "no-cache, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html" "/sw.js"

      - name: Summary
        run: |
          STAGE="${{ github.event.inputs.stage || 'dev' }}"
          if [ "$STAGE" = "prod" ]; then URL="https://yandle.world"; else URL="https://dev.yandle.world"; fi
          echo "Deployed $APP ($STAGE) -> $URL" >> $GITHUB_STEP_SUMMARY
